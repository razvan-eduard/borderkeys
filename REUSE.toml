# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 BorderKeys contributors
#
# REUSE annotations for files that carry no SPDX header of their own. `reuse lint` runs in CI as
# a blocking gate.

version = 1
SPDX-PackageName = "BorderKeys"
SPDX-PackageSupplier = "BorderKeys contributors"
SPDX-PackageDownloadLocation = "https://github.com/razvan-eduard/borderkeys"

# The licence text, also kept as ./LICENSE.
[[annotations]]
path = "LICENSE"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Submodule pointers. The vendored source's licensing is recorded in docs/licensing.md.
[[annotations]]
path = ".gitmodules"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Empty directory markers.
[[annotations]]
path = "**/.gitkeep"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The Gradle wrapper, redistributed verbatim from the Gradle distribution.
[[annotations]]
path = [
    "gradle/wrapper/gradle-wrapper.jar",
    "gradle/wrapper/gradle-wrapper.properties",
    "gradle/gradle-daemon-jvm.properties",
    "gradlew",
    "gradlew.bat",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"

# Dictionary and n-gram blobs produced by tools/build_dict.py. The provenance and licence of
# the word lists they are compiled from are recorded in docs/licensing.md.
[[annotations]]
path = "keyboard/src/main/assets/dict/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The word lists the bundled dictionaries are compiled from: counts of words and word pairs from
# the Wortschatz Leipzig corpora (wikipedia, news and newscrawl), published under CC BY 4.0. The
# attribution is here, in docs/licensing.md section 2.1, and in the About screen's source link.
[[annotations]]
path = "dictionaries/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Wortschatz Leipzig, Universität Leipzig"
SPDX-License-Identifier = "CC-BY-4.0"

# The same directory as written by this project: tab-separated data with no comment syntax
# (docs/licensing.md section 2.1).
[[annotations]]
path = "dictionaries/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The words each language's Hunspell spelling dictionary lists in lower case, read off the
# LibreOffice dictionaries by tools/make_ordinary.py: a yes/no per corpus word, not a copy of any
# dictionary. The dictionaries and their licences are in docs/licensing.md 2.1.1.
[[annotations]]
path = "dictionaries/*.names-ordinary"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Part-of-speech tags and transition matrices, derived by tools/build_pos.py from Universal
# Dependencies treebanks. The treebanks are CC-BY-SA-4.0, one CC-BY-4.0; Creative Commons declares a
# one-way compatibility from CC-BY-SA-4.0 to GPL-3.0, so what is derived from them ships under the GPL.
# Attribution is in docs/licensing.md, which names each treebank.
[[annotations]]
path = "dictionaries/*.pos"
precedence = "aggregate"
SPDX-FileCopyrightText = "Universal Dependencies contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The downloadable packs' grammars, from the treebanks their manifests in tools/languages name:
# CC-BY-SA-4.0, except Polish LFG, GPL-3.0-only, and Arabic PUD, CC-BY-SA-3.0.
[[annotations]]
path = "dictionaries/extra/*.pos"
precedence = "aggregate"
SPDX-FileCopyrightText = "Universal Dependencies contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "dictionaries/extra/pl_PL.pos"
precedence = "aggregate"
SPDX-FileCopyrightText = "Universal Dependencies contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "dictionaries/extra/ar.pos"
precedence = "aggregate"
SPDX-FileCopyrightText = "Universal Dependencies contributors"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# Every user-facing word in the product, one JSON file per language.
[[annotations]]
path = "i18n/src/main/assets/translations/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The emoji palette, compiled by tools/build_emoji.py from Unicode's emoji-test.txt, and the
# keywords under keywords/, compiled by the same tool from Unicode CLDR's annotation files: code
# points, groups, names and keywords. Unicode Licence; the attribution is this entry and
# docs/licensing.md.
[[annotations]]
path = "keyboard/src/main/assets/emoji/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

# Keyboard layout descriptions. Plain data, authored here.
[[annotations]]
path = "keyboard/src/main/assets/layouts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The compose key's table, written by tools/make_compose.py from the sources in tools/compose.
[[annotations]]
path = "keyboard/src/main/assets/compose/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "1987, 1994, 1998 The Open Group",
    "1987 Digital Equipment Corporation",
    "Jules Aguillon and the Unexpected Keyboard contributors",
]
SPDX-License-Identifier = "MIT-open-group AND HPND AND GPL-3.0-only"

# X11's en_US.UTF-8 compose sequences and key names, copied from libX11 and xorgproto.
[[annotations]]
path = ["tools/compose/2-en_US_UTF_8_Compose.pre", "tools/compose/keysymdef.h"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["1987, 1994, 1998 The Open Group", "1987 Digital Equipment Corporation"]
SPDX-License-Identifier = "MIT-open-group AND HPND"

# Each subtype language's extra keys, written by tools/make_extra_keys.py from Unexpected
# Keyboard's subtype table, which tools/extra_keys holds as copied.
[[annotations]]
path = ["keyboard/src/main/assets/extra_keys.json", "tools/extra_keys/method.xml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Jules Aguillon and the Unexpected Keyboard contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# The extra, Arabic and Cyrillic compose sequences, copied from Unexpected Keyboard.
[[annotations]]
path = "tools/compose/*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "Jules Aguillon and the Unexpected Keyboard contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# Per-language accent overlays: the letters a long press reaches for each enabled language.
# Plain data, authored here.
[[annotations]]
path = "keyboard/src/main/assets/accents/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The per-language manifests tools/new_language.py builds the downloadable packs from. Plain
# data, authored here.
[[annotations]]
path = "tools/languages/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The training logs behind the shipped swipe checkpoint (tools/swipe_model/README.md).
[[annotations]]
path = "tools/swipe_model/*.log"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Per-language lists of the words the "Block offensive words" switch keeps out of suggestions
# and learning. Authored here, checked for coverage against the LDNOOBW lists (CC BY 4.0), not
# copied from them.
[[annotations]]
path = "keyboard/src/main/assets/offensive/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Corpus payloads, fixtures and gate rules read by the JVM tests, with no header of their own.
[[annotations]]
path = ["keyboard/src/test/resources/**", "data/src/test/resources/**", "i18n/src/test/resources/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Test corpora and recorded swipe gestures for the native tests and tools/gesture_replay.py.
[[annotations]]
path = "native-tests/data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Real typos sampled by tools/make_real_corpus.py from the ITE Typing dataset (Aalto University,
# 2024, doi:10.5281/zenodo.12528162); docs/licensing.md, the test data table.
[[annotations]]
path = "native-tests/data/autocorrect_real_en.tsv"
precedence = "override"
SPDX-FileCopyrightText = "2024 Katri Leino, Markku Laine, Mikko Kurimo, Antti Oulasvirta, Aalto University"
SPDX-License-Identifier = "CC-BY-4.0"

# Words and the word before each, sampled by tools/make_case_corpus.py from the Wortschatz Leipzig
# 2020 news sentences; docs/licensing.md, the test data table.
[[annotations]]
path = "native-tests/data/autocorrect_case_*.tsv"
precedence = "override"
SPDX-FileCopyrightText = "Wortschatz Leipzig, Universität Leipzig"
SPDX-License-Identifier = "CC-BY-4.0"

# Words sampled by tools/make_unlisted_corpus.py from Android's stock keyboard word lists
# (LineageOS's copy of LatinIME); docs/licensing.md, the test data table.
[[annotations]]
path = "native-tests/data/autocorrect_unlisted_en.tsv"
precedence = "override"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

# The neural swipe decoder's trained weights, plus-only (keyboard/build.gradle.kts,
# BORDERKEYS_NEURAL_SWIPE). Trained from scratch by tools/swipe_model/train.py on the MIT-licensed
# futo-org/swipe.futo.org corpus (docs/licensing.md section 2.5); no other model's weights or
# output are involved.
[[annotations]]
path = "keyboard/src/plus/assets/model.bkw"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The script layouts' swipe weights, plus-only: the Latin weights above fine-tuned by
# tools/swipe_model/train.py on swipes of the same corpus laid onto each layout.
[[annotations]]
path = "keyboard/src/plus/assets/swipe/*.bkw"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The recorded swipe accuracy the CI gates compare against, one file per decoder.
[[annotations]]
path = "docs/gesture-accuracy*.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Room's exported schemas. Generated by KSP, committed so a migration shows up as a diff.
[[annotations]]
path = "data/schemas/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The README's header artwork: own work, commissioned by the maintainer for this project.
[[annotations]]
path = "docs/images/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# F-Droid/Fastlane store listing metadata: title, descriptions, and screenshots of this
# application's own screens. The .txt files are read verbatim as the store listing.
[[annotations]]
path = "fastlane/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
