# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 BorderKeys contributors
#
# REUSE annotations for files that cannot carry a comment header of their own: binary blobs,
# generated resources, and the handful of text files where a header would be part of the
# content. `reuse lint` runs in CI and is a blocking gate, so every path in the repository has
# to be covered either by an SPDX header or by an entry below.

version = 1
SPDX-PackageName = "BorderKeys"
SPDX-PackageSupplier = "BorderKeys contributors"
SPDX-PackageDownloadLocation = "https://github.com/razvan-eduard/borderkeys"

# The licence text itself. Duplicated as ./LICENSE because that is where GitHub, F-Droid and
# most humans look, while REUSE only reads LICENSES/.
[[annotations]]
path = "LICENSE"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Submodule pointers. The vendored source itself is a separate repository with its own
# licensing, recorded in docs/licensing.md; REUSE correctly declines to descend into it.
[[annotations]]
path = ".gitmodules"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Empty directory markers. They exist so that the module source roots survive a clone; every
# one of them disappears as its step lands.
[[annotations]]
path = "**/.gitkeep"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The Gradle wrapper. Not our code: it is redistributed verbatim from the Gradle
# distribution, and committing it is what makes the build reproducible from a bare clone.
[[annotations]]
path = [
    "gradle/wrapper/gradle-wrapper.jar",
    "gradle/wrapper/gradle-wrapper.properties",
    "gradle/gradle-daemon-jvm.properties",
    "gradlew",
    "gradlew.bat",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"

# Dictionary and n-gram blobs produced by tools/build_dict.py (step 3). The code is ours; the
# word lists they are compiled from are not, and each one's provenance and licence is recorded
# by hand in docs/licensing.md, because nothing can derive that automatically.
[[annotations]]
path = "keyboard/src/main/assets/dict/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The word lists the bundled dictionaries are compiled from. Counted from the Wortschatz Leipzig
# news corpora, which are published under CC BY 4.0: the attribution that licence asks for is
# here, in docs/licensing.md section 2.1, and in the About screen's source link. What is stored
# is counts of words and word pairs, not the sentences they were counted from.
[[annotations]]
path = "dictionaries/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Wortschatz Leipzig, Universität Leipzig"
SPDX-License-Identifier = "CC-BY-4.0"

# The older annotation, kept for anything else that lands in the directory. Tab-separated data with no comment
# syntax, so the licence is recorded here rather than in a header that would have to be skipped
# by every reader of the file. Written by this project, which is what makes shipping the
# compiled packs a licence question with an answer -- see docs/licensing.md section 2.1.
[[annotations]]
path = "dictionaries/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Keyboard layout descriptions. Plain data, authored here.
[[annotations]]
path = "keyboard/src/main/assets/layouts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Recorded swipe gestures used by tools/gesture_replay.py and the native tests (step 6.6).
[[annotations]]
path = "native-tests/data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The recorded swipe accuracy the CI gate compares against. JSON has no comment syntax, and a
# number the build refuses to regress past should be a plain machine-readable file rather than
# one with a licence header wrapped around it.
[[annotations]]
path = "docs/gesture-accuracy.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Room's exported schemas. Generated by KSP, committed so a migration shows up as a diff.
[[annotations]]
path = "data/schemas/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BorderKeys contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
