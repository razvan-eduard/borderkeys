# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 BorderKeys contributors
#
# Single source of truth for every external coordinate in the build. Nothing in a
# module script may hardcode a version: `verifyNoForbiddenDependencies` inspects the
# resolved graph, but a catalog is what keeps the graph small enough to reason about.

[versions]
# Toolchain. Pinned as a validated set; bumping one of these means re-validating all of them.
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.11"
ndk = "27.1.12297006"
cmake = "3.22.1"

# SDK levels. minSdk 30 is a hard floor, not a convenience: inline autofill suggestions
# (the password-manager integration, section 5.4) only exist from Android 11.
compileSdk = "37"
minSdk = "30"
targetSdk = "36"

# Runtime libraries.
composeBom = "2026.06.01"
room = "2.8.4"
datastore = "1.2.1"
coroutines = "1.11.0"
activity = "1.13.0"
autofill = "1.3.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
securityCrypto = "1.1.0"
serialization = "1.9.0"
sqlcipher = "4.11.0"
# Must track what room-runtime resolves to, otherwise SQLCipher's SupportSQLiteOpenHelper
# implementation and Room's expectation of it drift apart at runtime rather than at build time.
sqlite = "2.6.2"

# Test-only.
androidxTestCore = "1.7.0"
junit = "4.13.2"
mockk = "1.14.6"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }

androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
# AGP 9 has built-in Kotlin support and refuses to coexist with org.jetbrains.kotlin.android,
# so that plugin is deliberately absent; the `kotlin` version above still drives the two
# Kotlin compiler plugins below.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
