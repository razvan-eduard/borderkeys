# 4 GB: the NDK build plus KSP plus R8 on two flavors outgrows the 2 GB default and
# fails late, during dexing, where the error is least readable.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
# Each module gets its own R class holding only its own resources. Keeps :keyboard's R
# small and makes an accidental cross-module resource reference a compile error.
android.nonTransitiveRClass=true

# GPL section 6 wants the corresponding source to be findable from the binary. The About
# screen shows this URL together with the commit hash baked into BuildConfig.
# Canonical repository for this project.
borderkeys.sourceUrl=https://github.com/razvan-eduard/borderkeys
