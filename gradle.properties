# 4 GB, for the NDK build, KSP and R8 on two flavors.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
# Each module's R class holds only its own resources.
android.nonTransitiveRClass=true

# The canonical repository, shown on the About screen beside the commit hash (GPL section 6).
borderkeys.sourceUrl=https://github.com/razvan-eduard/borderkeys

# Where the assistant build is offered: the F-Droid repository and the releases page, both
# handed to a browser with ACTION_VIEW.
borderkeys.repoUrl=https://razvan-eduard.github.io/vox-fdroid-repo/fdroid/repo
borderkeys.releasesUrl=https://github.com/razvan-eduard/borderkeys/releases

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
