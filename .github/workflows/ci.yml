name: CI

# Every push to main and every pull request against it. The release workflow only wakes on a
# version bump or a tag, so without this a commit that touches :keyboard or :data and no
# version would never be compiled by anything until the next release — which then blames
# whoever released.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A second push makes the first irrelevant: only the tip needs to be green. Releases
# deliberately do not do this — abandoning a publish half way is a different kind of mess —
# but a verification run is safe to cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, not minutes, and it fails on things a reviewer cannot see in a diff: a new file
  # without an SPDX header, an asset with no REUSE annotation. Its own job and first, because a
  # missing licence header should not be reported after a ten-minute Android build.
  licensing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The charset-normalizer extra rather than plain `reuse`: without an encoding-detection
      # module the tool cannot even import, and which one is available depends on whether
      # libmagic happens to be on the runner. Pinning the pure-Python one removes the variable.
      - name: Install REUSE
        run: pipx install 'reuse[charset-normalizer]'

      # Blocking, not advisory. The project claims to be open source from the first commit;
      # a file nobody can tell the licence of makes that claim false.
      - name: reuse lint
        run: reuse lint

  verify:
    runs-on: ubuntu-latest

    env:
      # gradle.properties asks for 4 GB, sized for one developer machine building one flavor.
      # This job compiles both flavors and runs R8 twice in a single invocation. Raised here
      # rather than in gradle.properties so a laptop is not asked to reserve 6 GB for every
      # build.
      GRADLE_HEAP: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      # The `plus` flavor compiles llama.cpp from the vendored submodule, so the build cannot
      # run without it. Shallow: the pinned commit is all that is needed, and a full clone of
      # llama.cpp is several hundred megabytes for history nobody here reads.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      # 21 because gradle/gradle-daemon-jvm.properties pins the daemon to 21. A different JDK
      # here means the runner downloads its own, silently, on every run.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          # The action's own default package list is "tools platform-tools", and Google has
          # since pulled the legacy "tools" package from the SDK repository entirely --
          # sdkmanager now fails outright trying to fetch it. platform-tools is all this step
          # is actually here for (adb, the rest comes from Gradle's own SDK resolution).
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Read out of the catalog rather than restated here, so a CI run and a release cannot
      # compile the same native code with different compilers.
      - name: Resolve the pinned NDK and CMake
        run: |
          echo "NDK_VERSION=$(grep -m1 '^ndk = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$(grep -m1 '^cmake = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # The pipeline harness drives the real engine over JNI against the real packs, and skips
      # itself when either is missing. CI was precisely that machine: both were built later in
      # this job, so every pipeline case skipped here from the day it was written and the step
      # went green over three known defects. Built before the tests, and Pipeline.require()
      # fails rather than skips when CI is set, so this cannot quietly come undone again.
      - name: Build what the pipeline harness needs
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build native-tests/build --parallel --target borderkeys
          ./gradlew :keyboard:buildDictionaries --no-daemon "$GRADLE_HEAP"

      - name: Unit tests, every module
        run: ./gradlew test --no-daemon "$GRADLE_HEAP"

      # Both flavors, because the interesting failures are asymmetric: `plus` compiles native
      # code `core` does not, and `core` is the one whose emptiness is the product claim.
      # The three verification tasks are wired into assemble, so this runs them.
      - name: Assemble both flavors
        run: ./gradlew :app:assembleCoreRelease :app:assemblePlusRelease --no-daemon "$GRADLE_HEAP"

      # Named explicitly as well. If someone unwires a gate from `assemble` while leaving the
      # task in place, the step above goes green and this one does not.
      - name: Verification gates
        run: |
          ./gradlew --no-daemon "$GRADLE_HEAP" \
            :app:verifyNoInternetPermission \
            :app:verifyNoForbiddenDependencies \
            :keyboard:verifyKeyboardHasNoCompose

      # The Gradle tasks check the sources of the APK. This checks the APK. They are not the
      # same claim: a merged manifest with no INTERNET and a packaged binary with no INTERNET
      # are separated by resource shrinking, R8 and the packager.
      - name: The shipped APKs request no permissions at all
        run: |
          set -euo pipefail
          AAPT2="$(find -L "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)/aapt2"
          FAILED=0
          for FLAVOR in core plus; do
            APK="$(find "app/build/outputs/apk/$FLAVOR/release" -name '*.apk' | head -1)"
            if [ -z "$APK" ]; then
              echo "::error::no APK found for flavor $FLAVOR"
              exit 1
            fi
            PERMS="$("$AAPT2" dump permissions "$APK" | grep -E '^(uses-permission|permission):' || true)"
            if [ -n "$PERMS" ]; then
              echo "::error::$FLAVOR APK declares permissions:"
              echo "$PERMS"
              FAILED=1
            else
              echo "$FLAVOR: zero permissions"
            fi
          done
          exit "$FAILED"

      # `plusImplementation` is what keeps the assistant out of the free build, and it is a
      # single line in one build file. Asserted against the dex rather than trusted: DEX stores
      # type descriptors as plain strings, so grep is enough and needs no extra tooling.
      - name: The core APK contains no assistant code, runtime or model files
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/core/release -name '*.apk' | head -1)"
          WORK="$(mktemp -d)"
          unzip -o -q "$APK" -d "$WORK" 'classes*.dex'
          if grep -qa 'Lcom/borderkeys/assist/' "$WORK"/classes*.dex; then
            echo "::error::core APK contains com.borderkeys.assist classes"
            exit 1
          fi
          # The inference runtime is a native library, so it would not show up in the dex check
          # above even if the whole of llama.cpp were packaged.
          if unzip -l "$APK" | grep -q 'borderkeysassist'; then
            echo "::error::core APK contains the inference runtime"
            exit 1
          fi
          MODELS="$(unzip -l "$APK" | grep -iE '\.(gguf|tflite|onnx|pt|pte|safetensors)$' || true)"
          if [ -n "$MODELS" ]; then
            echo "::error::core APK contains model files:"
            echo "$MODELS"
            exit 1
          fi
          echo "core APK: no assistant classes, no inference runtime, no model files"

      # Neither flavor bundles a model. `plus` ships the runtime and nothing to run: a model
      # arrives because the user chose a file, and that keeps `plus` free of non-free assets.
      - name: Neither flavor bundles a model
        run: |
          set -euo pipefail
          for FLAVOR in core plus; do
            APK="$(find "app/build/outputs/apk/$FLAVOR/release" -name '*.apk' | head -1)"
            if unzip -l "$APK" | grep -iqE '\.(gguf|pte|onnx|safetensors)$'; then
              echo "::error::$FLAVOR APK bundles a model"
              exit 1
            fi
          done
          echo "no model files in either flavor"

      # The .bkd writer and the engine that reads it are two implementations of one format,
      # and the only thing keeping them in agreement is that both were written against
      # bkd_format.hpp. This builds a pack and reads it back with an independent reader, so a
      # drift in the layout fails here rather than as a pack the keyboard silently cannot use.
      - name: Dictionary compiler round trip
        run: python3 tools/build_dict.py --selftest

      # Which letters a language admits is read off its long-press overlay, so an overlay edited
      # for the sake of the keys can silently decide what the dictionary may hold. Only a letter
      # with no unaccented twin can do that -- "ß", "æ", "œ" -- and this is what says one left.
      - name: Language alphabets are what the dictionaries were built against
        run: python3 tools/drop_unreachable.py --selftest

      - name: The layout assets, their subtypes and their labels agree
        run: python3 tools/check_layouts.py

      # Runs from step 8 onward, when native-tests/ exists. Guarded rather than omitted so the
      # step is already wired and cannot be forgotten later; it prints what it skipped, because
      # a silently absent check reads exactly like a passing one.
      # The engine compiled for the host and run against the same sources the device gets.
      # The test pack is produced by tools/build_dict.py rather than by a fixture, so a drift
      # between the writer and the reader fails here instead of shipping.
      # Every header has to compile on its own. The alternative is a header that works only
      # because whatever included it first happened to pull in <cstdint>, which is true on
      # libc++ and false on libstdc++ -- so it builds on the machine it was written on and
      # fails here, which is exactly what happened.
      - name: Headers are self-contained
        run: |
          set -euo pipefail
          status=0
          for header in $(find keyboard/src/main/cpp native-tests -name '*.hpp' | sort); do
            printf '#include "%s"\n' "$PWD/$header" > /tmp/header-check.cpp
            if ! g++ -std=c++17 -fsyntax-only -I keyboard/src/main/cpp /tmp/header-check.cpp; then
              echo "not self-contained: $header"
              status=1
            fi
          done
          exit $status

      - name: Native tests
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build native-tests/build --parallel
          ctest --test-dir native-tests/build --output-on-failure

      # ctest runs entirely against test_pack.bkd, a 3 KB pack built by build_dict.py --selftest,
      # so until this step nothing in CI ever queried a shipped dictionary -- the packs were
      # compiled above and never asked a question. This asks the only one that has to hold: a
      # word compiled into a pack must come back out of it.
      #
      # Case is not part of it: a pack keeps one casing of "Warren"/"warren" and the keyboard
      # capitalises for itself, so the other casing is reachable. The budgets are defect counts,
      # not properties of the languages, and they may only ever
      # be lowered. What remains is two things: a spelling merged into another that differs from
      # it only by case, which the keyboard re-cases for itself, and a short fragment the corpus
      # carries that no longer ranks once real words compete with it -- "th", "pr", "inc".
      - name: Every word in a pack is reachable from it
        run: |
          set -euo pipefail
          packs=keyboard/build/generated/dictionaries/dict
          status=0
          while read -r tag budget; do
            file=${tag//-/_}
            ./native-tests/build/suggest_eval "$packs" --reachable \
              "dictionaries/$file.tsv" "$tag" "$budget" || status=1
          done <<'BUDGETS'
          en-US 611
          ro-RO 402
          de-DE 183
          es-ES 315
          fr-FR 334
          it-IT 246
          BUDGETS
          exit $status

      # The same loader, under the sanitisers, with the checksums repaired after each mutation
      # so the mutation reaches the section-bounds and traversal checks rather than being
      # absorbed by the CRC. A crash here is a build failure, not a report.
      - name: Language-pack loader under ASan and UBSan
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build native-tests/build-asan --target pack_corpus_test --parallel
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            ./native-tests/build-asan/pack_corpus_test

      # The same loader under libFuzzer, seeded from the committed corpus, with a fixed time
      # budget so the job stays bounded. pack_corpus_test covers this ground deterministically
      # on every run; this is what finds the inputs nobody thought to write down. A crash fails
      # the build, and the reproducer is uploaded so it can become a corpus entry rather than
      # having to be re-derived.
      - name: Language-pack loader under libFuzzer
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build-fuzz -DCMAKE_BUILD_TYPE=Debug \
            -DBORDERKEYS_FUZZ=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build native-tests/build-fuzz --target fuzz_pack --parallel
          # The committed corpus is copied out first. libFuzzer writes the inputs it keeps back
          # into the directory it is given, and data/corpus is a fixture with eighteen named
          # cases in it, not a scratch pad.
          mkdir -p /tmp/fuzz-corpus /tmp/fuzz-artifacts
          cp native-tests/data/corpus/*.bkd /tmp/fuzz-corpus/
          # A valid pack in the seed set matters more than any of the broken ones: it is the
          # only input from which the fuzzer can reach the code behind the header checks.
          cp native-tests/build/test_pack.bkd /tmp/fuzz-corpus/valid.bkd
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            ./native-tests/build-fuzz/fuzz_pack /tmp/fuzz-corpus \
              -max_total_time=90 -max_len=1048576 -rss_limit_mb=2048 \
              -error_exitcode=1 -print_final_stats=1 \
              -artifact_prefix=/tmp/fuzz-artifacts/

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducers
          path: /tmp/fuzz-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      # Accuracy is the only thing that says whether a decoder change helped. Compared against
      # the number recorded in docs/gesture-accuracy.json, so a regression fails here rather
      # than being noticed on a device weeks later.
      # Both tiers, against the real English pack and 500 recorded traces. The pack matters as
      # much as the corpus: the 59-word test pack this used to gate against made almost any
      # decode correct.
      - name: Swipe decoder accuracy
        run: |
          set -euo pipefail
          python3 tools/gesture_replay.py \
            --binary native-tests/build/gesture_replay \
            --pack "$PWD/keyboard/build/generated/dictionaries/dict/en_US.bkd" \
            --corpus "$PWD/native-tests/data/gestures_futo.csv" \
            --check-regression
          python3 tools/tcn_replay.py \
            --binary native-tests/build/tcn_replay \
            --pack "$PWD/keyboard/build/generated/dictionaries/dict/en_US.bkd" \
            --weights "$PWD/keyboard/src/plus/assets/model.bkw" \
            --corpus "$PWD/native-tests/data/gestures_futo.csv" \
            --check-regression

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/borderkeys/**
          retention-days: 7
          if-no-files-found: ignore

  # The keyboard on a real input connection. The unit tests and the pipeline harness stop at
  # the engine's answer; what the framework's editor does with a composing region, a caret
  # move or a commit is only visible on a device, so app/src/androidTest drives the settings
  # probe field through the keyboard on an emulator. KVM is what makes an x86_64 emulator
  # usable on a hosted runner, and the shipped ABIs do not include x86_64, so the build adds
  # it here and nowhere else.
  smoke:
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]

    env:
      GRADLE_HEAP: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve the pinned NDK and CMake
        run: |
          echo "NDK_VERSION=$(grep -m1 '^ndk = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$(grep -m1 '^cmake = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Build the dictionaries
        run: ./gradlew :keyboard:buildDictionaries --no-daemon "$GRADLE_HEAP"

      # The core flavour: the paths under test are the same in both, and core compiles no
      # inference runtime. API 30 is minSdk, the oldest editor the keyboard claims to work
      # with; API 35 is the newest.
      - name: Smoke suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedCoreDebugAndroidTest -Pborderkeys.extraAbis=x86_64 --no-daemon "$GRADLE_HEAP"

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
