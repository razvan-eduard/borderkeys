name: CI

# Every push to main and every pull request against it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A newer push cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPDX headers and REUSE annotations, in a job of its own.
  licensing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # With the charset-normalizer extra, its encoding detection.
      - name: Install REUSE
        run: pipx install 'reuse[charset-normalizer]'

      # Blocking, not advisory.
      - name: reuse lint
        run: reuse lint

  verify:
    runs-on: ubuntu-latest

    env:
      # More heap than gradle.properties' 4 GB: this job builds both flavors and runs R8 twice.
      GRADLE_HEAP: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      # With the llama.cpp submodule the `plus` flavor compiles; shallow.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      # 21, the JDK gradle/gradle-daemon-jvm.properties pins the daemon to.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          # Not the action's default list, whose legacy "tools" package the SDK repository no
          # longer has.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Read out of the catalog, as the release workflow does.
      - name: Resolve the pinned NDK and CMake
        run: |
          echo "NDK_VERSION=$(grep -m1 '^ndk = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$(grep -m1 '^cmake = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # The host engine library, the real packs and the tap corpora the pipeline harness runs
      # against, built before the tests; Pipeline.require() and TapCorpusTest fail rather than
      # skip when CI is set.
      - name: Build what the pipeline harness needs
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build native-tests/build --parallel --target borderkeys
          ./gradlew :keyboard:buildDictionaries --no-daemon "$GRADLE_HEAP"
          mkdir -p native-tests/build/taps
          for profile in centred low thumbs right-thumb precise sloppy; do
            python3 tools/make_tap_corpus.py --profile "$profile" --taps 60000 --seed 1 \
              > "native-tests/build/taps/$profile.tsv"
          done

      - name: Unit tests, every module
        run: ./gradlew test --no-daemon "$GRADLE_HEAP" -Pborderkeys.taps="$PWD/native-tests/build/taps"

      # Both flavors. The three verification tasks are wired into assemble.
      - name: Assemble both flavors
        run: ./gradlew :app:assembleCoreRelease :app:assemblePlusRelease --no-daemon "$GRADLE_HEAP"

      # Named explicitly as well.
      - name: Verification gates
        run: |
          ./gradlew --no-daemon "$GRADLE_HEAP" \
            :app:verifyNoInternetPermission \
            :app:verifyNoForbiddenDependencies \
            :keyboard:verifyKeyboardHasNoCompose

      # The packaged APKs themselves, through aapt2.
      - name: The shipped APKs request no permissions at all
        run: |
          set -euo pipefail
          AAPT2="$(find -L "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)/aapt2"
          FAILED=0
          for FLAVOR in core plus; do
            APK="$(find "app/build/outputs/apk/$FLAVOR/release" -name '*.apk' | head -1)"
            if [ -z "$APK" ]; then
              echo "::error::no APK found for flavor $FLAVOR"
              exit 1
            fi
            PERMS="$("$AAPT2" dump permissions "$APK" | grep -E '^(uses-permission|permission):' || true)"
            if [ -n "$PERMS" ]; then
              echo "::error::$FLAVOR APK declares permissions:"
              echo "$PERMS"
              FAILED=1
            else
              echo "$FLAVOR: zero permissions"
            fi
          done
          exit "$FAILED"

      # Checked in the dex, which stores type descriptors as plain strings.
      - name: The core APK contains no assistant code, runtime or model files
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/core/release -name '*.apk' | head -1)"
          WORK="$(mktemp -d)"
          unzip -o -q "$APK" -d "$WORK" 'classes*.dex'
          if grep -qa 'Lcom/borderkeys/assist/' "$WORK"/classes*.dex; then
            echo "::error::core APK contains com.borderkeys.assist classes"
            exit 1
          fi
          # The inference runtime is a native library, outside the dex.
          if unzip -l "$APK" | grep -q 'borderkeysassist'; then
            echo "::error::core APK contains the inference runtime"
            exit 1
          fi
          MODELS="$(unzip -l "$APK" | grep -iE '\.(gguf|tflite|onnx|pt|pte|safetensors)$' || true)"
          if [ -n "$MODELS" ]; then
            echo "::error::core APK contains model files:"
            echo "$MODELS"
            exit 1
          fi
          echo "core APK: no assistant classes, no inference runtime, no model files"

      - name: Neither flavor bundles a model
        run: |
          set -euo pipefail
          for FLAVOR in core plus; do
            APK="$(find "app/build/outputs/apk/$FLAVOR/release" -name '*.apk' | head -1)"
            if unzip -l "$APK" | grep -iqE '\.(gguf|pte|onnx|safetensors)$'; then
              echo "::error::$FLAVOR APK bundles a model"
              exit 1
            fi
          done
          echo "no model files in either flavor"

      # A pack built and read back with an independent reader.
      - name: Dictionary compiler round trip
        run: python3 tools/build_dict.py --selftest

      - name: Case evidence counting
        run: python3 tools/make_case_evidence.py --selftest

      # The letters with no unaccented twin ("ß", "æ", "œ") are still on their overlays.
      - name: Language alphabets are what the dictionaries were built against
        run: python3 tools/drop_unreachable.py --selftest

      - name: Every kind of list merges onto the plain apostrophe
        run: python3 tools/merge_apostrophes.py --selftest

      - name: The layout assets, their subtypes and their labels agree
        run: python3 tools/check_layouts.py

      - name: The compose table matches its generator
        run: python3 tools/make_compose.py --check

      - name: The extra keys match their generator
        run: python3 tools/make_extra_keys.py --check

      # Every header compiles on its own, with libstdc++.
      - name: Headers are self-contained
        run: |
          set -euo pipefail
          status=0
          for header in $(find keyboard/src/main/cpp native-tests -name '*.hpp' | sort); do
            printf '#include "%s"\n' "$PWD/$header" > /tmp/header-check.cpp
            if ! g++ -std=c++17 -fsyntax-only -I keyboard/src/main/cpp /tmp/header-check.cpp; then
              echo "not self-contained: $header"
              status=1
            fi
          done
          exit $status

      - name: Native tests
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build native-tests/build --parallel
          ctest --test-dir native-tests/build --output-on-failure

      # Every word compiled into a shipped pack comes back out of it, in either casing. The
      # budgets are defect counts and may only be lowered.
      - name: Every word in a pack is reachable from it
        run: |
          set -euo pipefail
          packs=keyboard/build/generated/dictionaries/dict
          status=0
          while read -r tag budget; do
            file=${tag//-/_}
            ./native-tests/build/suggest_eval "$packs" --reachable \
              "dictionaries/$file.tsv" "$tag" "$budget" || status=1
          done <<'BUDGETS'
          en-US 530
          ro-RO 337
          de-DE 162
          es-ES 289
          fr-FR 297
          it-IT 222
          BUDGETS
          exit $status

      # The context model on each bundled language's Universal Dependencies test split. The
      # floors are the top-three shares with context, in percent, for the next word and after
      # one, two and three letters, and may only be raised.
      - name: The context model holds its floors on held-out text
        run: |
          set -euo pipefail
          packs=keyboard/build/generated/dictionaries/dict
          out=native-tests/build/context
          python3 tools/make_context_corpus.py "$out"
          pids=()
          while read -r language tag next one two three; do
            ./native-tests/build/suggest_eval "$packs" --context "$out/context_$language.txt" \
              "$tag" "$next" "$one" "$two" "$three" > "$out/$language.log" 2>&1 &
            pids+=("$!")
          done <<'FLOORS'
          en en-US 25.1 49.5 61.3 74.6
          ro ro-RO 22.1 40.5 42.2 58.5
          de de-DE 19.1 43.8 58.1 62.7
          fr fr-FR 26.2 49.8 58.0 70.05
          es es-ES 29.4 53.4 55.8 67.1
          it it-IT 23.4 42.62 51.3 63.2
          FLOORS
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          cat "$out"/*.log
          exit $status

      # The strip's first-place share on the strip corpora, English pack alone. The floors are
      # percentages and may only be raised.
      - name: The strip holds its first-place floors
        run: |
          set -euo pipefail
          packs=keyboard/build/generated/dictionaries/dict
          status=0
          while read -r corpus floor; do
            echo "== $corpus"
            ./native-tests/build/suggest_eval "$packs" "native-tests/data/$corpus.tsv" en-US \
              --first-floor "$floor" | tail -n 6 || status=1
          done <<'FLOORS'
          suggest_en 75.0
          suggest_slip_en 83.0
          FLOORS
          exit $status

      # The touch model alone on the six tap profiles: autocorrect's right word with the taps
      # and the default patterns, in percent. The floors may only be raised.
      - name: The touch model holds its floors on the tap corpora
        run: |
          set -euo pipefail
          packs=keyboard/build/generated/dictionaries/dict
          taps=native-tests/build/taps
          pids=()
          while read -r profile floor; do
            ./native-tests/build/touch_eval "$packs" en-US native-tests/data/qwerty_1080.layout \
              "$taps/$profile.tsv" --train-taps 20000 --test-from-taps 40000 --test-words 4000 \
              --floor "$floor" > "$taps/$profile.log" 2>&1 &
            pids+=("$!")
          done <<'FLOORS'
          centred 92.0
          low 90.8
          thumbs 91.5
          right-thumb 90.9
          precise 94.0
          sloppy 90.8
          FLOORS
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          tail -n 6 "$taps"/*.log
          exit $status

      # The same loader under the sanitisers, with the checksums repaired after each mutation.
      # A crash fails the build.
      - name: Language-pack loader under ASan and UBSan
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build native-tests/build-asan --target pack_corpus_test --parallel
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            ./native-tests/build-asan/pack_corpus_test

      # The same loader under libFuzzer, seeded from the committed corpus, for a fixed time. A
      # crash fails the build, and the reproducer is uploaded.
      - name: Language-pack loader under libFuzzer
        run: |
          set -euo pipefail
          cmake -S native-tests -B native-tests/build-fuzz -DCMAKE_BUILD_TYPE=Debug \
            -DBORDERKEYS_FUZZ=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build native-tests/build-fuzz --target fuzz_pack --parallel
          # The committed corpus is copied out first: libFuzzer writes into the directory it is
          # given.
          mkdir -p /tmp/fuzz-corpus /tmp/fuzz-artifacts
          cp native-tests/data/corpus/*.bkd /tmp/fuzz-corpus/
          # A valid pack in the seed set.
          cp native-tests/build/test_pack.bkd /tmp/fuzz-corpus/valid.bkd
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            ./native-tests/build-fuzz/fuzz_pack /tmp/fuzz-corpus \
              -max_total_time=90 -max_len=1048576 -rss_limit_mb=2048 \
              -error_exitcode=1 -print_final_stats=1 \
              -artifact_prefix=/tmp/fuzz-artifacts/

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducers
          path: /tmp/fuzz-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      # Both decoders, against the real English pack and 500 recorded traces, compared with the
      # numbers recorded in docs/gesture-accuracy.json and docs/gesture-accuracy-tcn.json.
      - name: Swipe decoder accuracy
        run: |
          set -euo pipefail
          python3 tools/gesture_replay.py \
            --binary native-tests/build/gesture_replay \
            --pack "$PWD/keyboard/build/generated/dictionaries/dict/en_US.bkd" \
            --corpus "$PWD/native-tests/data/gestures_futo.csv" \
            --check-regression
          python3 tools/tcn_replay.py \
            --binary native-tests/build/tcn_replay \
            --pack "$PWD/keyboard/build/generated/dictionaries/dict/en_US.bkd" \
            --weights "$PWD/keyboard/src/plus/assets/model.bkw" \
            --corpus "$PWD/native-tests/data/gestures_futo.csv" \
            --check-regression

      # Each shipped script model, on polylines through its own layout for held-out words of its
      # pack, against docs/gesture-accuracy-tcn-<layout>.json. The packs are compiled here.
      - name: Script swipe models
        run: |
          set -euo pipefail
          python3 tools/script_swipe_eval.py --shipped --build-packs --check-regression

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/borderkeys/**
          retention-days: 7
          if-no-files-found: ignore

  # The keyboard on a real input connection: app/src/androidTest drives the settings probe field
  # through the keyboard on an x86_64 emulator, with KVM. The build adds the x86_64 ABI here only.
  smoke:
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]

    env:
      GRADLE_HEAP: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve the pinned NDK and CMake
        run: |
          echo "NDK_VERSION=$(grep -m1 '^ndk = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$(grep -m1 '^cmake = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_ENV"

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Build the dictionaries
        run: ./gradlew :keyboard:buildDictionaries --no-daemon "$GRADLE_HEAP"

      # Termux, for the case that types a command into a terminal: its own release build,
      # checked against the digest its release publishes.
      - name: Fetch Termux
        run: |
          curl -fsSL -o termux.apk \
            "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_x86_64.apk"
          echo "3550e61f4d9eb49b712fd1bd9519dc37085a4d8eb597c57a340f0a64859b7144  termux.apk" | sha256sum -c -

      # The core flavour, on API 30 (minSdk) and API 35.
      - name: Smoke suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          # A phone-sized screen, the profile the suite is run against locally.
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r termux.apk
            ./gradlew :app:connectedCoreDebugAndroidTest -Pborderkeys.extraAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.termux=required --no-daemon "$GRADLE_HEAP"

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
