name: Deploy F-Droid Metadata

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Release"
    types:
      - completed

# Serializes BorderKeys' own runs. vox-fdroid-repo also receives pushes from VoxApps' own
# deploy-fdroid workflow; the push step below retries against those.
concurrency:
  group: deploy-fdroid-metadata-borderkeys
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded OR if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout BorderKeys
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout vox-fdroid-repo
        uses: actions/checkout@v7
        with:
          repository: razvan-eduard/vox-fdroid-repo
          path: fdroid-repo
          token: ${{ secrets.FDROID_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate BorderKeys' own F-Droid metadata
        run: bash scripts/sync_fdroid_metadata.sh

      - name: Merge, commit and push, retrying against a moving remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Generated metadata structure:"
          ls -R metadata_fdroid_sync/

          cd fdroid-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Every attempt below merges afresh from metadata_fdroid_sync/, built by the previous
          # step outside this checkout.
          merge_and_commit() {
              # BorderKeys' two application IDs only: their published changelogs are carried
              # across, then the fresh copy replaces everything on top.
              KEEP=$(mktemp -d)
              for APP_ID in com.borderkeys com.borderkeys.plus; do
                  if [ -d "metadata/$APP_ID" ]; then
                      (cd "metadata/$APP_ID" && find . -path '*/changelogs/*.txt' -print0 \
                          | while IFS= read -r -d '' f; do
                              mkdir -p "$KEEP/$APP_ID/$(dirname "$f")"
                              cp "$f" "$KEEP/$APP_ID/$f"
                            done)
                      rm -rf "metadata/$APP_ID"
                  fi
                  mkdir -p "metadata/$APP_ID"
                  [ -d "$KEEP/$APP_ID" ] && cp -RT "$KEEP/$APP_ID/" "metadata/$APP_ID/" || true
                  if [ -d "../metadata_fdroid_sync/$APP_ID" ]; then
                      cp -RT "../metadata_fdroid_sync/$APP_ID/" "metadata/$APP_ID/"
                  fi
              done

              # BorderKeys' own two application IDs, removals included; -f for ignored paths.
              git add -f metadata/com.borderkeys metadata/com.borderkeys.plus
              if git diff --staged --quiet; then
                  echo "No metadata changes to commit."
                  return 1
              fi
              git commit -m "Update metadata from BorderKeys release (true sync)"
          }

          # A rejected push is redone on the freshly fetched remote; VoxApps' subtrees and
          # BorderKeys' two never overlap.
          if ! merge_and_commit; then
              exit 0
          fi
          for attempt in 1 2 3 4 5; do
              if git push; then
                  exit 0
              fi
              echo "Push rejected (attempt $attempt), resyncing onto the latest remote state..."
              git reset --hard HEAD~1
              git fetch origin
              git reset --hard origin/main
              sleep $((attempt * 5))
              if ! merge_and_commit; then
                  echo "Nothing left to commit after resync -- another run already covered this."
                  exit 0
              fi
          done
          echo "::error::Failed to push to vox-fdroid-repo after retries"
          exit 1
