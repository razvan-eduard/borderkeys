name: Deploy F-Droid Metadata

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Release"
    types:
      - completed

# vox-fdroid-repo also receives pushes from VoxApps' own deploy-fdroid workflow, in a different
# repository, so this concurrency group only serializes BorderKeys' own runs against each other
# -- it cannot stop a VoxApps run from landing between this job's checkout and its push. The
# retrying push step below is what actually protects against that: refetch and rebase onto
# whatever landed in between, rather than assuming this checkout is still current.
concurrency:
  group: deploy-fdroid-metadata-borderkeys
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded OR if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout BorderKeys
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout vox-fdroid-repo
        uses: actions/checkout@v7
        with:
          repository: razvan-eduard/vox-fdroid-repo
          path: fdroid-repo
          token: ${{ secrets.FDROID_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate BorderKeys' own F-Droid metadata
        run: bash scripts/sync_fdroid_metadata.sh

      - name: Merge, commit and push, retrying against a moving remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Generated metadata structure:"
          ls -R metadata_fdroid_sync/

          cd fdroid-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # metadata_fdroid_sync/ (built by the previous step, outside this checkout) is the
          # one source of truth for what this run should produce -- every attempt below merges
          # from it fresh, so a hard-reset recovery on a later attempt can never lose the
          # generated content, only redo the same merge against newer remote state.
          merge_and_commit() {
              # The generator only ever writes the *current* version's changelog, but F-Droid
              # clients show the history -- every already-published <versionCode>.txt exists
              # only in the deployed tree and is regenerated by nobody. So BorderKeys' own two
              # app-ID subtrees are carried across the clean, oldest first, and the fresh copy
              # replaces them on top so everything else (icons, descriptions, screenshots)
              # still propagates as a true sync. Other apps' subtrees under metadata/ (VoxApps'
              # own) are never touched -- this only ever clears its own two application IDs.
              KEEP=$(mktemp -d)
              for APP_ID in com.borderkeys com.borderkeys.plus; do
                  if [ -d "metadata/$APP_ID" ]; then
                      (cd "metadata/$APP_ID" && find . -path '*/changelogs/*.txt' -print0 \
                          | while IFS= read -r -d '' f; do
                              mkdir -p "$KEEP/$APP_ID/$(dirname "$f")"
                              cp "$f" "$KEEP/$APP_ID/$f"
                            done)
                      rm -rf "metadata/$APP_ID"
                  fi
                  mkdir -p "metadata/$APP_ID"
                  [ -d "$KEEP/$APP_ID" ] && cp -RT "$KEEP/$APP_ID/" "metadata/$APP_ID/" || true
                  if [ -d "../metadata_fdroid_sync/$APP_ID" ]; then
                      cp -RT "../metadata_fdroid_sync/$APP_ID/" "metadata/$APP_ID/"
                  fi
              done

              # Add just BorderKeys' own two application IDs -- new, modified and deleted files
              # alike; `git add` on a path stages removals of tracked files too. -f is needed
              # for ignored paths.
              git add -f metadata/com.borderkeys metadata/com.borderkeys.plus
              if git diff --staged --quiet; then
                  echo "No metadata changes to commit."
                  return 1
              fi
              git commit -m "Update metadata from BorderKeys release (true sync)"
          }

          # VoxApps' own deploy-fdroid workflow pushes to this exact branch from a different
          # repository, so a plain `git push` here can be rejected as non-fast-forward by a run
          # that landed in between checkout and push. VoxApps' subtrees and BorderKeys' two
          # never overlap, so redoing the merge against a freshly-pulled tree and recommitting
          # is always conflict-free -- there is nothing here for a real merge conflict to land
          # on, only a stale base to refresh.
          if ! merge_and_commit; then
              exit 0
          fi
          for attempt in 1 2 3 4 5; do
              if git push; then
                  exit 0
              fi
              echo "Push rejected (attempt $attempt), resyncing onto the latest remote state..."
              git reset --hard HEAD~1
              git fetch origin
              git reset --hard origin/main
              sleep $((attempt * 5))
              if ! merge_and_commit; then
                  echo "Nothing left to commit after resync -- another run already covered this."
                  exit 0
              fi
          done
          echo "::error::Failed to push to vox-fdroid-repo after retries"
          exit 1
