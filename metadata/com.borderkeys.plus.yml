#
# The `plus` flavour, published as its own package so that it and `core` are a choice a user can
# decline to make. With one applicationId, installing this would replace the other: the
# repository could only list one of them, and taking the assistant would mean giving up the
# settings and the learned dictionary of the build it replaced. As separate packages both can be
# listed and both can be installed, at the cost of them learning separately.
#
# No AntiFeatures. This adds llama.cpp (MIT, compiled from the vendored source) and the libc++ it
# links against (Apache-2.0 with the LLVM exception). It bundles no model and cannot fetch one:
# there is still no INTERNET permission. A model arrives only when the user picks a file whose
# SHA-256 matches an entry compiled into the build, and all five of those are Apache-2.0. See
# docs/licensing.md section 2.2.1.

