# The same release certificate as the core package. A build signed by anything else is rejected
# rather than quietly accepted.
AllowedAPKSigningKeys: f49409d101891a6d5c7254168b083cc4d0772cda2448cc853e8e2f331b4e5321

# The vendored llama.cpp checkout (assist/src/main/cpp/third_party/llama.cpp) is a git
# submodule, and this is the flavour that actually compiles it -- without this, the build
# server's checkout leaves that directory empty and the native build fails on missing source.
Submodules: true

