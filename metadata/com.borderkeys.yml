#
# F-Droid metadata for the `core` flavour: the one that carries no inference runtime at all.
#
# `plus` is published too, as its own package, in com.borderkeys.plus.yml. It is a separate
# application rather than a replacement, so the two can be installed side by side and choosing
# the assistant does not cost anyone the settings and dictionary of the build it would have
# replaced. It needs no AntiFeatures either: llama.cpp is MIT and compiled from source, the
# libc++ it links against is Apache-2.0 with the LLVM exception, and it bundles no model. See
# docs/licensing.md section 2.2.1.
#
# This comment used to claim `plus` would need NonFreeAssets. That was written while the plan
# still included the FUTO Swipe weights, which are genuinely non-free -- they require a visible
# "powered by FUTO" notice. That option was never taken: its runtime needs CMake 3.29 against
# the 3.22.1 this project pins. The weights never shipped and the note outlived them.

